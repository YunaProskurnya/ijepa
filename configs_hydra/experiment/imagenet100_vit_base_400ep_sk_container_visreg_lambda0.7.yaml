# @package _global_
defaults:
  - override /system: default
  
training:
  collator: custom
  model: vit_base
  mode: joint
  regularizer: visreg
  regularizer_weight: 0.7
  batch_size: 128
  accumulation_steps: 1
  epochs: 400
  max_steps: null
  warmup_epochs: 1
  lr: 6.25e-05
  start_lr: 6.25e-06
  final_lr: 6.25e-08
  weight_decay: 0.04
  final_weight_decay: 0.4
  seed: 0
