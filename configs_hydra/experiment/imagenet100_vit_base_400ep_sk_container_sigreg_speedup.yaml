# @package _global_
defaults:
  - override /system: default

system:
  num_workers: 32
  compile: true
  fused_adamw: true
  cudnn_benchmark: true
  resume: /home/container/shared/rejepa/runs/imagenet100-vit-base-400ep-sigreg/checkpoint_9.pt

training:
  collator: custom
  model: vit_base
  mode: joint
  regularizer: sigreg
  regularizer_weight: 0.02
  batch_size: 128
  accumulation_steps: 1
  epochs: 400
  max_steps: null
  warmup_epochs: 1
  lr: 6.25e-05
  start_lr: 6.25e-06
  final_lr: 6.25e-08
  weight_decay: 0.04
  final_weight_decay: 0.4
  seed: 0
